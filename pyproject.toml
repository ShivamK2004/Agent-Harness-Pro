[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-pro"
version = "1.3.0"
description = "Multi-provider, multi-agent LLM evaluation and reliability harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "streamlit>=1.39,<2.0",
  "requests>=2.32,<3.0",
  "python-dotenv>=1.0,<2.0",
  "google-genai>=1.0.0",
  "pydantic>=2.8,<3.0",
  "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
